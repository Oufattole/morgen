#   ABNORMAL_HEMATOCRIT: 'LOINC/4544-3//value_\[-inf,23.8\)'
#   ABNORMAL_HEMOGLOBIN: 'LOINC/718-7//value_\[-inf,7.8\)'
#   ABNORMAL_LEUKOCYTE: 'LOINC/6690-2//value_\[4.19,4.52\)\|LOINC/6690-2//value_\[2.86,3.1\)\|LOINC/6690-2//value_\[3.6,3.88\)\|LOINC/6690-2//value_\[3.88,4.19\)\|LOINC/6690-2//value_\[4.52,5.1\)\|LOINC/6690-2//value_\[2.59,2.86\)\|LOINC/6690-2//value_\[-inf,2.59\)\|LOINC/6690-2//value_\[3.1,3.32\)\|LOINC/6690-2//value_\[3.32,3.6\)'
#   ABNORMAL_PLATELET: 'LOINC/777-3//value_\[54.0,104.0\)\|LOINC/777-3//value_\[-inf,54.0\)'

# Quantizer configuration
quantizer_config:
  vocab_size: ${get_vocab_size:${datamodule.config.tensorized_cohort_dir}} # Number of medical codes in histogram (full vocabulary)
  embedding_dim: 16 # Latent embedding dimension
  n_embeddings: 128 # Codebook size (number of discrete tokens)
  max_count: 64 # Count clipping level for count-histogram quantization
  beta: 0.25 # VQ-VAE beta parameter
  encoder_hidden_dims: [64, 32, 16] # Encoder network architecture
  decoder_hidden_dims: [16, 32, 64] # Decoder network architecture
  dropout: 0.0 # Dropout rate

datamodule:
  window_size_days: ${window_size_days}
window_size_days: 30

lightning_module:
  learning_rate: 1e-3
  weight_decay: 0.01

# Training configuration
trainer:
  max_epochs: 10
  # limit_train_batches: 20
  logger:
    _target_: pytorch_lightning.loggers.WandbLogger
    project: "Morgen"
    name: "histogram_quantizer"
    save_dir: "."
    log_model: false

# Output configuration
output_dir: null # Will be set at runtime
do_overwrite: false
do_resume: false
seed: null
